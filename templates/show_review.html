<!DOCTYPE html>
<html>

<head>
    <title>{{ review.title }}</title>
</head>

<body>
    <h1>{{ review.title }}</h1>
    {% if session.user_id == review.user_id %}
    <p>
        <a href="/edit_review/{{ review.id }}">Muokkaa</a>
    </p>
    {% endif %}
    <p>
        {{ reivew.description}}
    </p>
    <p>
        Arvio: {{ review.verdict }} / 5
    </p>
    <p>
        Arvostelija: {{ review.username }}
    </p>
    <p>
        <a href="/">Takaisin</a>
    </p>
</body>

</html>
